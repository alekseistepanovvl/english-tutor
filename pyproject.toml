[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "english-learning"
version = "0.1.0"
description = "A local-first English vocabulary and grammar learning application."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7,<3",
    "streamlit>=1.40,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/english_learning"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

